name: Release

on:
  push:
    branches: [main]

env:
  NODE_VERSION: "20"

permissions:
  contents: write   # Required to create GitHub Releases, push tags, and upload assets
  pull-requests: write

jobs:
  build-and-release:
    name: Build & Auto-Release
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 2. Configure Git ───────────────────────────────────────────────────
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── 3. Setup Node.js ───────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # ── 4. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 5. Run tests before release ────────────────────────────────────────
      - name: Run win32-launch tests
        run: npm run test:win32-launch

      - name: Run persistence-shape tests
        run: npm run test:persistence-shape

      - name: Run radial windowing verification
        run: npm run verify:radial-windowing

      # ── 6. Auto-bump patch version ─────────────────────────────────────────
      - name: Auto-bump patch version
        id: bump
        run: node scripts/bump-version.mjs

      # ── 7. Commit version bump ─────────────────────────────────────────────
      - name: Commit version bump
        run: |
          git add package.json
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]" || echo "Nothing to commit"

      # ── 8. Push version bump to main ───────────────────────────────────────
      - name: Push version bump
        run: git push origin main

      # ── 9. Create and push tag ─────────────────────────────────────────────
      - name: Create and push tag
        run: |
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      # ── 10. Setup Node.js again (fresh for build) ──────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # ── 11. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 12. Build project ──────────────────────────────────────────────────
      - name: Build project (Vite + electron-builder)
        run: npm run build

      # ── 13. Publish release to GitHub ──────────────────────────────────────
      - name: Publish release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always
