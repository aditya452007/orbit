name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  NODE_VERSION: "20"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-release:
    name: Build & Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests before release
        run: |
          npm run test:win32-launch
          npm run test:persistence-shape
          npm run verify:radial-windowing

      - name: Build project
        run: npm run build

      - name: Create release & publish artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always
