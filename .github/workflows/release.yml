name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  NODE_VERSION: "20"

jobs:
  build-and-release:
    name: Build & Release
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ───────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Run tests before release ────────────────────────────────────────
      - name: Run win32-launch tests
        run: npm run test:win32-launch

      - name: Run persistence-shape tests
        run: npm run test:persistence-shape

      - name: Run radial windowing verification
        run: npm run verify:radial-windowing

      # ── 5. Build project ───────────────────────────────────────────────────
      - name: Build project (Vite + electron-builder)
        run: npm run build

      # ── 6. Publish release via electron-builder ────────────────────────────
      - name: Publish release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always
