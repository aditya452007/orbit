<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2cbf;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#heroGrad)" />

  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Glow behind radial wheel -->
  <circle cx="780" cy="200" r="180" fill="rgba(0,102,255,0.08)" filter="url(#glow)" />

  <!-- Radial wheel center -->
  <circle cx="780" cy="200" r="12" fill="#ffffff" />

  <!-- Orbit rings -->
  <circle cx="780" cy="200" r="70" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
  <circle cx="780" cy="200" r="110" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Orbiting segments -->
  <g filter="url(#glow)">
    <circle cx="780" cy="130" r="14" fill="url(#accentGrad)" />
    <circle cx="880" cy="200" r="14" fill="url(#accentGrad)" />
    <circle cx="780" cy="270" r="14" fill="url(#accentGrad)" />
    <circle cx="680" cy="200" r="14" fill="url(#accentGrad)" />
    <circle cx="850" cy="140" r="11" fill="url(#accentGrad)" />
    <circle cx="850" cy="260" r="11" fill="url(#accentGrad)" />
    <circle cx="710" cy="260" r="11" fill="url(#accentGrad)" />
    <circle cx="710" cy="140" r="11" fill="url(#accentGrad)" />
  </g>

  <!-- Title text -->
  <text x="120" y="210" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-2">Orbit</text>
  <text x="120" y="270" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1" letter-spacing="0">One gesture. Any destination.</text>
  <text x="120" y="310" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#64748b" letter-spacing="0">A radial launcher for Windows — hold middle mouse, aim, release.</text>
</svg>
