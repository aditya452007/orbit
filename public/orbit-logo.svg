<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2cbf;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background: dark navy -->
  <rect width="512" height="512" fill="#0f172a" rx="80" />

  <!-- Orbit rings -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2" />

  <!-- Orbiting segments (represent radial wheel slices) -->
  <g filter="url(#glow)">
    <circle cx="256" cy="116" r="22" fill="url(#orbitGrad)" />
    <circle cx="396" cy="256" r="22" fill="url(#orbitGrad)" />
    <circle cx="256" cy="396" r="22" fill="url(#orbitGrad)" />
    <circle cx="116" cy="256" r="22" fill="url(#orbitGrad)" />
    <circle cx="344" cy="168" r="18" fill="url(#orbitGrad)" />
    <circle cx="344" cy="344" r="18" fill="url(#orbitGrad)" />
    <circle cx="168" cy="344" r="18" fill="url(#orbitGrad)" />
    <circle cx="168" cy="168" r="18" fill="url(#orbitGrad)" />
  </g>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="34" fill="url(#centerGrad)" stroke="#ffffff" stroke-width="3" />

  <!-- Center connection lines (subtle) -->
  <line x1="256" y1="90" x2="256" y2="120" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  <line x1="256" y1="392" x2="256" y2="422" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  <line x1="120" y1="256" x2="90" y2="256" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  <line x1="392" y1="256" x2="422" y2="256" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  <line x1="192" y1="192" x2="168" y2="168" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  <line x1="320" y1="320" x2="344" y2="344" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  <line x1="192" y1="320" x2="168" y2="344" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  <line x1="320" y1="192" x2="344" y2="168" stroke="#ffffff" stroke-width="2" opacity="0.4" />
</svg>
